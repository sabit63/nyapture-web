openapi: 3.1.0
info:
  title: Nyaputure API
  version: v1
  description: |-
    Nya Book管理システム API - Book検索・ダウンロード管理・タグ管理・Webスクレイピング・データメンテナンス。
    REST API は `paths`、SignalR Hub はルート拡張 `x-signalr-hubs` に記載する。

servers:
  - url: http://localhost:5270
    description: ローカル開発環境

x-signalr-hubs:
  BookDownloadStatusHub:
    endpoint: /api/bookDownloadHub
    description: Bookダウンロードの状態、進捗、キュー、システム状態をリアルタイム配信するHub。
    access: public-with-api-key
    cors:
      policy: NyaputureApiCors
      allowPrivateNetworkOriginsSetting: Cors:AllowPrivateNetworkOrigins
      allowedOriginsSetting: Cors:AllowedOrigins
      allowCredentials: false
    authentication:
      dotNetClientHeader: X-Api-Key
      browserHttpScheme: Bearer
      browserWebSocketQueryParameter: access_token
      browserWithCredentials: false
      note: Bearer/access_token はこのHubのパスだけで検証される。APIキー使用時はHTTPSを利用する。
    serverMethods:
      - JoinGlobalMonitoring
      - LeaveGlobalMonitoring
      - RequestRunningDownloads
      - RequestQueuedDownloads
      - RequestAllDownloadStatuses
      - RequestSystemStatus
      - RequestBookDownloadStatus
      - NotifyDownloadStarted
      - NotifyDownloadProgress
      - NotifyDownloadCompleted
      - NotifyDownloadFailed
      - NotifyDownloadCancelled
    clientEvents:
      - ReceiveRunningDownloads
      - ReceiveQueuedDownloads
      - ReceiveAllDownloadStatuses
      - ReceiveSystemStatus
      - ReceiveBookDownloadStatus
      - BookDownloadStatusNotFound
      - BookDownloadStarted
      - BookDownloadProgress
      - BookDownloadCompleted
      - BookDownloadFailed
      - BookDownloadCancelled
      - BookDownloadStatusUpdate
    payloadSchemas:
      downloadStatus:
        $ref: "#/components/schemas/BookDownloadStatus"
      systemStatus:
        $ref: "#/components/schemas/BookDownloadSystemStatus"

  DashboardHub:
    endpoint: /hub/dashboard
    description: ViewerプロセスへDashboardの状態更新を配信するLocalOnly Hub。ブラウザからの直接接続は想定しない。
    access: local-only
    cors:
      enabled: false
    clientEvents:
      - download.progress
      - datastore.status
      - mongodb.status
      - cache.metrics
      - maintenance.progress
      - logs.entry
    payloadSchemas:
      downloadProgress:
        $ref: "#/components/schemas/DownloadJobDto"
      dataStoreStatus:
        $ref: "#/components/schemas/DataStoreSummary"
      legacyMongoStatus:
        $ref: "#/components/schemas/MongoSummary"
      cacheMetrics:
        $ref: "#/components/schemas/CacheMetricsResponse"
      maintenanceProgress:
        $ref: "#/components/schemas/DashboardMaintenanceResponse"
      logEntry:
        $ref: "#/components/schemas/DashboardLogEntryDto"

paths:
  /api/book/{groupId}/{bookId}/recommendations:
    get:
      tags: [Recommendations]
      summary: Book起点の関連作品・作者・グループ
      operationId: getBookRecommendations
      parameters:
        - {name: groupId, in: path, required: true, schema: {type: string}}
        - {name: bookId, in: path, required: true, schema: {type: string}}
        - {name: targetType, in: query, schema: {type: string, enum: [Book, Artist, Group, Both], default: Book}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        "200": {$ref: "#/components/responses/RecommendationResult"}
        "202": {$ref: "#/components/responses/RecommendationPending"}
        "404": {$ref: "#/components/responses/RecommendationNotFound"}
        "503": {$ref: "#/components/responses/RecommendationUnavailable"}
        "400": {description: キー・対象型・件数が不正}
  /api/books/{groupId}/{bookId}/recommendations:
    get:
      tags: [Recommendations]
      summary: Bookレコメンドの複数形パス別名
      operationId: getBookRecommendationsAlias
      parameters:
        - {name: groupId, in: path, required: true, schema: {type: string}}
        - {name: bookId, in: path, required: true, schema: {type: string}}
        - {name: targetType, in: query, schema: {type: string, enum: [Book, Artist, Group, Both], default: Book}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        "200": {$ref: "#/components/responses/RecommendationResult"}
        "202": {$ref: "#/components/responses/RecommendationPending"}
        "404": {$ref: "#/components/responses/RecommendationNotFound"}
        "503": {$ref: "#/components/responses/RecommendationUnavailable"}
        "400": {description: キー・対象型・件数が不正}
  /api/recommendations/entities/{entityType}:
    get:
      tags: [Recommendations]
      summary: Artist・Groupのタグ傾向による関連検索
      operationId: getEntityRecommendations
      parameters:
        - {name: entityType, in: path, required: true, schema: {type: string, enum: [Artist, Group]}}
        - {name: tagName, in: query, required: true, schema: {type: string}}
        - {name: targetType, in: query, schema: {type: string, enum: [Book, Artist, Group, Both], default: Both}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        "200": {$ref: "#/components/responses/RecommendationResult"}
        "202": {$ref: "#/components/responses/RecommendationPending"}
        "404": {$ref: "#/components/responses/RecommendationNotFound"}
        "503": {$ref: "#/components/responses/RecommendationUnavailable"}
        "400": {description: タグ名・型・件数が不正}
  /api/recommendations/status:
    get:
      tags: [Recommendations]
      summary: レコメンド索引の世代・生成件数・稼働状態
      operationId: getRecommendationStatus
      responses:
        "200":
          description: メトリクス。countsAvailable=falseの件数は実測値ではない。
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RecommendationMetrics"}
        "503":
          description: レコメンド機能またはDBが利用不能
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RecommendationMetrics"}
  # ============================================================
  # Book API
  # ============================================================
  /api/book/search:
    post:
      tags: [Book]
      summary: Book検索
      description: リクエストボディで検索フィルターを指定してBookを検索する
      operationId: searchBooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookSearchFilter"
      responses:
        "200":
          description: 検索結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EBookResponse"
        "400":
          description: リクエストパラメーターが不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EBookResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EBookResponse"
        "503":
          description: データベースタイムアウト
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EBookResponse"

  /api/book/{gid}/{id}:
    get:
      tags: [Book]
      summary: Book個別取得
      description: グループIDとBookIDを指定して単一のBookを取得する
      operationId: getBook
      parameters:
        - name: gid
          in: path
          required: true
          schema:
            type: string
          description: グループID
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: BookID
      responses:
        "200":
          description: Book取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EBookResponse"
        "400":
          description: パラメーター不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EBookResponse"
        "404":
          description: Bookが見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EBookResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EBookResponse"
    delete:
      tags: [Book]
      summary: Book削除ジョブ受付
      description: |-
        論理削除または物理削除をプロセス内キューへ登録し、直ちに202を返す。
        同じBook・同じ削除モードの実行中ジョブがある場合は、そのジョブを冪等に返す。
        キューとジョブ状態は永続化されないため、プロセス再起動時に失われる。
      operationId: deleteBook
      parameters:
        - name: gid
          in: path
          required: true
          schema:
            type: string
          description: グループID
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: BookID
        - name: remove
          in: query
          schema:
            type: boolean
          description: "削除モード（true: ページストレージとメタデータを削除、false/省略: ページストレージを削除してメタデータをDeletedで保持）"
      responses:
        "202":
          description: 削除ジョブを登録、または同じ条件の実行中ジョブを返却
          headers:
            Location:
              schema:
                type: string
              description: ジョブ状態取得URL
            Retry-After:
              schema:
                type: integer
              description: 再確認までの推奨秒数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDeletionJobResponse"
        "400":
          description: パラメーター不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NyaApiResponse"
        "403":
          description: 権限不足
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NyaApiResponse"
        "404":
          description: Bookが見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NyaApiResponse"
        "409":
          description: 同じBookに異なる削除モードのジョブが実行中
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDeletionJobResponse"
        "503":
          description: 削除キューが満杯
          headers:
            Retry-After:
              schema:
                type: integer
              description: 再試行までの推奨秒数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NyaApiResponse"

  /api/book/deletion-jobs/{jobId}:
    get:
      tags: [Book]
      summary: Book削除ジョブ状態取得
      description: プロセス内に保持されている削除ジョブの状態を取得する。完了ジョブは既定で24時間保持される
      operationId: getBookDeletionJob
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: 削除ジョブID
      responses:
        "200":
          description: ジョブ状態取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDeletionJobResponse"
        "404":
          description: ジョブが存在しない、期限切れ、またはプロセス再起動で失われた
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NyaApiResponse"

  /api/book/page:
    get:
      tags: [Book]
      summary: Bookページ画像取得
      description: 指定Bookのページ画像を取得する。リサイズ・圧縮オプション対応、キャッシュ機能付き
      operationId: getBookPage
      parameters:
        - name: bookId
          in: query
          required: true
          schema:
            type: string
          description: BookのID
        - name: groupId
          in: query
          required: true
          schema:
            type: string
          description: グループID
        - name: page
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
          description: ページ番号（1始まり）
        - name: width
          in: query
          schema:
            type: integer
            minimum: 1
          description: リサイズ後の画像幅（省略可能）
        - name: height
          in: query
          schema:
            type: integer
            minimum: 1
          description: リサイズ後の画像高さ（省略可能）
        - name: size
          in: query
          schema:
            type: number
          description: 目標ファイルサイズ（バイト）
        - name: strategy
          in: query
          schema:
            type: string
            enum: [balanced, quality, speed]
            default: balanced
          description: 圧縮戦略
        - name: format
          in: query
          schema:
            type: string
            enum: [jpg, jpeg, png, webp, avif]
          description: 出力フォーマット。指定時はフォーマット変換を実行
        - name: fallback_to_original
          in: query
          schema:
            type: boolean
            default: true
          description: オリジナルフォールバック。true（デフォルト）の場合、変換済み画像がなければオリジナルを即時返却。falseの場合、変換完了まで待機
      responses:
        "200":
          description: ページ画像データ
          headers:
            X-Image-Processed:
              schema:
                type: boolean
              description: 返却された画像が変換処理済みかどうか
          content:
            image/*:
              schema:
                type: string
                format: binary
        "400":
          description: パラメーター不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NyaApiResponse"
        "404":
          description: Bookまたはページが見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NyaApiResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NyaApiResponse"
        "503":
          description: 画像処理混雑（fallback_to_original=false時、並列制限超過）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NyaApiResponse"

  /api/book/search/grouped:
    post:
      tags: [Book]
      summary: タグタイプ別グループ検索
      description: 指定したタグタイプ（Artists, Parodies等）でBookをグループ化して検索する
      operationId: searchBooksGrouped
      parameters:
        - name: keyTagType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/NyaTagType"
          description: グループ化キーとなるタグタイプ
        - name: booksPerGroup
          in: query
          schema:
            type: integer
          description: グループ内の最大Book数
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: グループのページ番号
        - name: groupsPerPage
          in: query
          schema:
            type: integer
            default: 20
          description: 1ページあたりのグループ数
        - name: groupSortType
          in: query
          schema:
            $ref: "#/components/schemas/BookGroupSortType"
          description: グループのソート種別
        - name: isAscending
          in: query
          schema:
            type: boolean
            default: false
          description: 昇順ソートフラグ
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookSearchFilter"
        description: Book検索フィルター（省略可能）
      responses:
        "200":
          description: グループ化された検索結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EBookGroupResponse"
        "400":
          description: パラメーター不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EBookGroupResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EBookGroupResponse"
        "503":
          description: データベースタイムアウト
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EBookGroupResponse"

  /api/book/{gid}/{id}/title:
    patch:
      tags: [Book]
      summary: Bookタイトル更新
      description: 指定されたBookのタイトルを更新する
      operationId: updateBookTitle
      parameters:
        - name: gid
          in: path
          required: true
          schema:
            type: string
          description: グループID
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: BookID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookTitleUpdateRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NyaApiResponse"
        "400":
          description: パラメーター不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NyaApiResponse"
        "404":
          description: Bookが見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NyaApiResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NyaApiResponse"

  /api/book/{gid}/{id}/tags:
    post:
      tags: [Book]
      summary: Bookタグ追加
      description: 指定されたBookにタグを追加する
      operationId: addBookTags
      parameters:
        - name: gid
          in: path
          required: true
          schema:
            type: string
          description: グループID
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: BookID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookTagEditRequest"
      responses:
        "200":
          description: タグ追加成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NyaApiResponse"
        "400":
          description: パラメーター不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NyaApiResponse"
        "404":
          description: Bookが見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NyaApiResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NyaApiResponse"
    delete:
      tags: [Book]
      summary: Bookタグ削除
      description: 指定されたBookからタグを削除する
      operationId: removeBookTags
      parameters:
        - name: gid
          in: path
          required: true
          schema:
            type: string
          description: グループID
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: BookID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookTagEditRequest"
      responses:
        "200":
          description: タグ削除成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NyaApiResponse"
        "400":
          description: パラメーター不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NyaApiResponse"
        "404":
          description: Bookが見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NyaApiResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NyaApiResponse"

  # ============================================================
  # Tag API
  # ============================================================
  /api/tag/search:
    post:
      tags: [Tag]
      summary: タグ検索
      description: リクエストボディで検索フィルターを指定してタグを検索する
      operationId: searchTags
      parameters:
        - name: includeDisplayName
          in: query
          schema:
            type: boolean
            default: false
          description: DisplayName（日本語表示名）をレスポンスに含めるか
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagSearchFilter"
      responses:
        "200":
          description: 検索結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResponse"
        "400":
          description: リクエストパラメーターが不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResponse"
        "503":
          description: データベースタイムアウト
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResponse"

  /api/tag/autocomplete:
    get:
      tags: [Tag]
      summary: タグ名オートコンプリート
      description: provider-neutralなタグ名オートコンプリート契約。TagコレクションとTagAdditionalNameコレクションを横断検索し、英語名・日本語名の両方からサジェストする。現在のMongoDB provider実装はAtlas Searchを使用する
      operationId: autocompleteTags
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: 検索クエリ（1文字以上、英語/日本語両対応）
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/NyaTagType"
          description: タグタイプフィルター
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
          description: 最大件数
      responses:
        "200":
          description: オートコンプリート候補
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagAutocompleteResponse"
        "400":
          description: クエリが空
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagAutocompleteResponse"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagAutocompleteResponse"
        "503":
          description: autocomplete provider利用不能（互換errorCodeはatlas_search_unavailable。名称はlegacyで、Atlasに限定されない）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagAutocompleteResponse"

  /api/dashboard/cache/{bookId}:
    delete:
      tags: [Dashboard]
      summary: BookId指定画像キャッシュ削除
      description: 同じBookIdを持つ全Groupの画像キャッシュを削除する互換API
      operationId: removeDashboardBookCacheForAllGroups
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 削除成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NyaApiResponse"
        "400":
          description: BookIdが不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NyaApiResponse"
        "403":
          description: ローカル以外からの変更操作
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NyaApiResponse"

  /api/dashboard/cache/{groupId}/{bookId}:
    delete:
      tags: [Dashboard]
      summary: Group指定画像キャッシュ削除
