                example: alive

components:
  responses:
    RecommendationResult:
      description: success（空候補を含む）またはno_features。旧投影使用時はisStale=true。
      content:
        application/json:
          schema: {$ref: "#/components/schemas/RecommendationResponse"}
    RecommendationPending:
      description: 正本は存在するが投影作成待ち
      headers:
        Retry-After: {schema: {type: integer, example: 60}}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/RecommendationResponse"}
    RecommendationNotFound:
      description: 起点が存在しない、または削除済み
      content:
        application/json:
          schema: {$ref: "#/components/schemas/RecommendationResponse"}
    RecommendationUnavailable:
      description: 任意機能が無効、または検索投影を利用できない
      content:
        application/json:
          schema: {$ref: "#/components/schemas/RecommendationResponse"}
  schemas:
    RecommendationKey:
      type: object
      required: [entityType]
      properties:
        entityType: {type: string, enum: [Book, Artist, Group]}
        groupId: {type: string}
        bookId: {type: string}
        tagName: {type: string}
    RecommendationEntity:
      type: object
      properties:
        key: {$ref: "#/components/schemas/RecommendationKey"}
        totalBookCount: {type: integer}
        semanticBookCount: {type: integer}
        exactBookCount: {type: integer}
        representativeTags: {type: array, items: {type: string}}
        thumbnailBook:
          description: 保存完了・保存先あり・1ページ以上の所属BookのうちuploadedTimeが最新のもの。対象なしはnull。
          anyOf: [{$ref: "#/components/schemas/RecommendationThumbnailBook"}, {type: "null"}]
    RecommendationThumbnailBook:
      type: object
      required: [groupId, bookId, uploadedTime]
      properties:
        groupId: {type: string}
        bookId: {type: string}
        uploadedTime: {type: string, format: date-time}
    RecommendationHit:
      type: object
      properties:
        key: {$ref: "#/components/schemas/RecommendationKey"}
        score: {type: number, description: 一致確率ではない。同一起点内でのみ比較可能。}
        signals:
          type: object
          properties:
            titleRank: {type: [integer, "null"], minimum: 1}
            semanticTagRank: {type: [integer, "null"], minimum: 1}
            exactTagRank: {type: [integer, "null"], minimum: 1}
        commonTags: {type: array, items: {type: string}}
        reasons: {type: array, items: {type: string}}
        book:
          anyOf: [{$ref: "#/components/schemas/EBook"}, {type: "null"}]
        entity:
          anyOf: [{$ref: "#/components/schemas/RecommendationEntity"}, {type: "null"}]
    RecommendationTagDisplayName:
      type: object
      required: [type, name, displayName]
      properties:
        type: {$ref: "#/components/schemas/NyaTagType"}
        name: {type: string, description: 変更されない元のタグ名}
        displayName: {type: string, description: 承認済みの日本語表示名（追加名）}
    RecommendationResponse:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [success, no_features, pending, not_found, unavailable]}
        profileVersion: {type: [string, "null"]}
        exactWeightingVersion: {type: [string, "null"], example: sqrt-idf-v1}
        generateEmbeddings: {type: [boolean, "null"]}
        tagDisplayNames:
          type: array
          description: 応答内のタグの承認済み表示名。typeとnameで対応付ける。未登録・未承認・取得失敗時は該当項目なし。
          items: {$ref: "#/components/schemas/RecommendationTagDisplayName"}
        isStale: {type: boolean}
        detail: {type: [string, "null"]}
        sourceEntity:
          anyOf: [{$ref: "#/components/schemas/RecommendationEntity"}, {type: "null"}]
        items:
          type: [array, "null"]
          items: {$ref: "#/components/schemas/RecommendationHit"}
    RecommendationMetrics:
      type: object
      properties:
        status: {type: string, enum: [ready, pending, unavailable]}
        profileVersion: {type: [string, "null"]}
        exactWeightingVersion: {type: [string, "null"], example: sqrt-idf-v1}
        generateEmbeddings: {type: [boolean, "null"]}
        model: {type: string}
        modelRevision: {type: [string, "null"]}
        preprocessingVersion: {type: [string, "null"]}
        countsAvailable: {type: boolean}
        catalogBooks: {type: integer, format: int64}
        evaluatedBooks: {type: integer, format: int64}
        pendingBooks: {type: integer, format: int64}
        failedBooks: {type: integer, format: int64}
        missingTitle: {type: integer, format: int64}
        missingSemantic: {type: integer, format: int64}
        missingExact: {type: integer, format: int64}
        artistCount: {type: integer, format: int64}
        groupCount: {type: integer, format: int64}
        entityTotalBookCount: {type: integer, format: int64}
        entitySemanticBookCount: {type: integer, format: int64}
        entityExactBookCount: {type: integer, format: int64}
        entityMissingSemantic: {type: integer, format: int64}
        entityMissingExact: {type: integer, format: int64}
        entityPendingCount: {type: integer, format: int64}
        lastReconciledAt: {type: [string, "null"], format: date-time}
        oldestPendingAt: {type: [string, "null"], format: date-time}
        projectionDelaySeconds: {type: [number, "null"]}
        lastError: {type: [string, "null"]}
        qualityStatus: {type: string, example: tag_similarity_only}
        embeddingRuntimeStatus: {type: string, enum: [ready, unavailable, model_mismatch, unknown, disabled]}
        generationThrottling:
          description: このAPIインスタンスの生成用CPU制御。検索リクエストは待機対象外。
          anyOf: [{$ref: "#/components/schemas/CpuThrottleStatus"}, {type: "null"}]
        embeddingThrottling:
          description: 埋め込みサービスのhealthから取得するCPU制御。生成無効時はdisabled、旧サービスや取得不能時はnull。
          anyOf: [{$ref: "#/components/schemas/CpuThrottleStatus"}, {type: "null"}]
    CpuThrottleStatus:
      type: object
      properties:
        enabled: {type: boolean}
        state: {type: string, enum: [disabled, initializing, ready, throttled, unavailable]}
        cpuUsagePercent: {type: [number, "null"], minimum: 0, maximum: 100}
        measurementScope: {type: string, enum: [none, linux_host_or_vm, windows_host, unsupported]}
        lastMeasuredAt: {type: [string, "null"], format: date-time}
        waitReason: {type: [string, "null"], enum: [null, initial_measurement, cpu_high, measurement_unavailable, measurement_stale]}
        isWaiting: {type: boolean, description: 生成処理がCPU待機中か。埋め込み側ではAPIの再送待機を表す。}
    # ----------------------------------------------------------
    # 基本レスポンス
    # ----------------------------------------------------------
    NyaApiResponse:
      type: object
      properties:
        success:
          type: boolean
          description: 処理結果
        message:
          type: string
          description: メッセージ

    # ----------------------------------------------------------
    # Book
    # ----------------------------------------------------------
    EBook:
      type: object
      properties:
        url:
          type: string
          description: BookのURL
        groupId:
          type: string
          description: グループID
        bookId:
          type: string
          description: BookID
        title:
          type: string
          description: タイトル
        captions:
          type: object
          additionalProperties:
            type: string
          description: キャプション（言語別）
        totalPage:
          type: integer
          description: 総ページ数
        tagSet:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: タグセット（NyaTagType -> タグ名リスト）
        uploadedTime:
          type: string
          format: date-time
          description: アップロード日時
        pageUrls:
          type: array
          items:
            type: string
          description: ページ画像URLリスト
        status:
          $ref: "#/components/schemas/NyaBookStatus"

    NyaBookStatus:
      type: string
      enum: [Unknown, Standby, Downloaded, Downloading, Cancel, DownloadError, SaveError, ShortPage, Shredding, Deleted, WebBook, WebBookInPage]
      description: Bookのステータス

    BookDeletionJob:
      type: object
      required: [jobId, groupId, bookId, disposition, status, createdAtUtc, statusUrl]
      properties:
        jobId:
          type: string
          format: uuid
        groupId:
          type: string
        bookId:
          type: string
        disposition:
          type: string
          enum: [Logical, Physical]
        status:
          type: string
          enum: [Pending, Running, Succeeded, Failed]
        createdAtUtc:
          type: string
          format: date-time
        startedAtUtc:
          type: [string, "null"]
          format: date-time
        completedAtUtc:
          type: [string, "null"]
          format: date-time
        failureMessage:
          type: [string, "null"]
        statusUrl:
          type: string

    BookDeletionJobResponse:
      allOf:
        - $ref: "#/components/schemas/NyaApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/BookDeletionJob"

    EBookResponse:
      allOf:
        - $ref: "#/components/schemas/NyaApiResponse"
        - type: object
          properties:
            books:
              type: array
              items:
                $ref: "#/components/schemas/EBook"
              description: Book一覧
            tags:
              type: array
              items:
                $ref: "#/components/schemas/TagEntity"
              description: 関連タグ一覧
            totalCount:
              type: integer
              description: 総件数
            currentPage:
              type: integer
              description: 現在のページ番号
            totalPage:
              type: integer
              description: 総ページ数
            pageSize:
              type: integer
              description: 1ページあたりの件数

    EBookGroupResponse:
      allOf:
        - $ref: "#/components/schemas/NyaApiResponse"
        - type: object
          properties:
            groups:
              type: array
              items:
                $ref: "#/components/schemas/EBookGroup"
              description: グループ一覧
            keyTagType:
              type: string
              description: グループ化キーのタグタイプ
            totalGroupCount:
              type: integer
              description: 総グループ数
            currentPage:
              type: integer
              description: 現在のページ番号
            totalPage:
              type: integer
              description: 総ページ数

    EBookGroup:
      type: object
      properties:
        keyTagType:
          type: string
          description: グループ化キーのタグタイプ
        keyTagValue:
          type: string
          description: グループ化キーのタグ値
        keyTagDisplayName:
          type: string
          description: グループ化キーのタグ表示名（TagAdditionalNameから取得、nullの場合あり）
        totalBooksCount:
          type: integer
          description: グループ内のBook総数
        books:
          type: array
          items:
            $ref: "#/components/schemas/EBook"
          description: グループ内のBook一覧

    BookSearchFilter:
      type: object
      properties:
        tagSet:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: タグフィルター（包含）
        exclusionTagSet:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: タグフィルター（除外）
        texts:
          type: array
          items:
            type: string
          description: 検索テキスト（包含）
        exclusionTexts:
          type: array
          items:
            type: string
          description: 検索テキスト（除外）
        bookGroups:
          type: array
          items:
            type: string
          description: Bookグループフィルター（包含）
        exclusionBookGroups:
          type: array
          items:
            type: string
          description: Bookグループフィルター（除外）
        bookIds:
          type: array
          items:
            type: string
          description: BookIDフィルター（包含）
        exclusionBookIds:
          type: array
          items:
            type: string
          description: BookIDフィルター（除外）
        missingTagTypes:
          type: array
          items:
            $ref: "#/components/schemas/NyaTagType"
          description: 欠損タグタイプフィルター
        status:
          type: array
          items:
            $ref: "#/components/schemas/NyaBookStatus"
          description: ステータスフィルター（包含）
        exclusionStatus:
          type: array
          items:
            $ref: "#/components/schemas/NyaBookStatus"
          description: ステータスフィルター（除外）
        lowerUploadedTime:
          type: string
          format: date-time
          description: アップロード日時下限
        upperUploadedTime:
          type: string
          format: date-time
          description: アップロード日時上限
        lowerPageCount:
          type: integer
          description: ページ数下限
        upperPageCount:
          type: integer
          description: ページ数上限
        sortType:
          type: string
          enum: [UploadedTime, Title, TotalPage, UpdatedTime]
          description: ソート種別
        isAsc:
          type: boolean
          description: 昇順フラグ
        isAnd:
          type: boolean
          description: AND検索フラグ
        limit:
          type: integer
          description: 取得件数制限
        page:
          type: integer
          description: ページ番号

    BookTitleUpdateRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          description: 新しいタイトル

    BookTagEditRequest:
      type: object
      required: [tagType, tags]
      properties:
        tagType:
          type: string
          description: タグタイプ（NyaTagType名を文字列で指定）
        tags:
          type: array
          items:
            type: string
          description: 追加・削除するタグ名リスト

    # ----------------------------------------------------------
    # Tag
    # ----------------------------------------------------------
    NyaTagType:
      type: string
      enum: [Unknown, Parodies, Characters, Categories, Groups, Artists, Tags, Languages]
      description: タグの種別

    TagEntity:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/NyaTagType"
        name:
          type: string
          description: タグ名
        count:
          type: integer
          description: 使用回数
        displayName:
          type: string
          description: 日本語表示名（TagAdditionalNameから取得、Approved状態のみ。nullの場合あり）

    TagAutocompleteResponse:
      allOf:
        - $ref: "#/components/schemas/NyaApiResponse"
        - type: object
          properties:
            errorCode:
              type: [string, "null"]
              description: 機械可読なlegacy互換エラーコード。autocomplete provider利用不能時はatlas_search_unavailable（名称はAtlasに限定されない）
            tags:
              type: array
              items:
                $ref: "#/components/schemas/TagAutocompleteSuggestion"
              description: オートコンプリート候補
            totalCount:
              type: integer
              format: int64
              description: 検索結果の総件数
            currentPage:
              type: integer
              description: 現在のページ番号
            totalPage:
              type: integer
              description: 総ページ数
            pageSize:
              type: integer
              description: 1ページあたりの件数

    TagAutocompleteSuggestion:
      type: object
      properties:
        name:
          type: string
          description: タグ名（英語）
        tagType:
          type: string
          description: タグタイプ
        count:
          type: integer
          description: 使用回数
        displayName:
          type: string
          description: 日本語表示名（TagAdditionalNameから取得、nullの場合あり）
        score:
          type: number
          format: double
          description: 検索providerが計算したrelevanceスコア

    TagSearchFilter:
      type: object
      properties:
        tagTypes:
          type: array
          items:
            $ref: "#/components/schemas/NyaTagType"
          description: タグタイプフィルター
        names:
          type: array
          items:
            type: string
          description: タグ名フィルター
        searchType:
          type: string
          enum: [Exact, Fuzzy]
          default: Fuzzy
          description: 検索タイプ（Exact=完全一致、Fuzzy=部分一致）
        sortType:
          type: string
          enum: [Type, Name, Created, Count]
          default: Type
          description: ソート種別（Type=タグタイプ別、Name=名前順、Created=作成日時順、Count=件数順）
        isAsc:
          type: boolean
          description: 昇順フラグ
        isAnd:
          type: boolean
          description: AND検索フラグ
        limit:
          type: integer
          description: 取得件数制限
        page:
          type: integer
          description: ページ番号

    TagResponse:
      allOf:
        - $ref: "#/components/schemas/NyaApiResponse"
        - type: object
          properties:
            tags:
              type: array
              items:
                $ref: "#/components/schemas/TagEntity"
              description: タグ一覧
            totalCount:
              type: integer
              description: 総件数
            currentPage:
              type: integer
              description: 現在のページ番号
            totalPage:
              type: integer
              description: 総ページ数
            pageSize:
              type: integer
              description: 1ページあたりの件数

    # ----------------------------------------------------------
    # Download
    # ----------------------------------------------------------
    BookDownloadRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: ダウンロード対象のURL
        priority:
          type: integer
          description: 優先度
        requestedBy:
          type: string
          description: リクエスト元の識別子

    BookDownloadStatus:
      type: object
      properties:
        book:
          $ref: "#/components/schemas/EBook"
        executionState:
          $ref: "#/components/schemas/BookDownloadExecutionState"
        thumbnailUrl:
          type: string
          description: サムネイルURL
        currentPage:
          type: integer
          description: 現在のダウンロードページ
        completedPages:
          type: integer
          description: 完了ページ数
        failedPages:
          type: integer
          description: 失敗ページ数
        priority:
          type: integer
          description: 優先度
        downloadSpeed:
          type: number
          description: ダウンロード速度
        errorMessage:
          type: string
          description: エラーメッセージ
        startedAt:
          type: string
          format: date-time
          description: 開始日時
        lastUpdated:
          type: string
          format: date-time
          description: 最終更新日時
        requestedBy:
          type: string
          description: リクエスト元
        hostName:
          type: string
          description: ホスト名
        queuePosition:
          type: integer
          description: キュー内の位置
        queuedAt:
          type: string
          format: date-time
          description: キュー追加日時

    BookDownloadExecutionState:
      type: string
      enum: [Queued, Running, Paused, Stopped, Completed, Failed, Cancelled]
      description: ダウンロード実行状態

    BookDownloadSystemStatus:
      type: object
      properties:
        runningCount:
          type: integer
          description: 実行中のダウンロード数
        queuedCount:
          type: integer
          description: キュー待ちのダウンロード数
        pausedCount:
          type: integer
          description: 一時停止中のダウンロード数
        isSystemRunning:
          type: boolean
          description: システム稼働フラグ
        lastUpdated:
          type: string
          format: date-time
          description: 最終更新日時

    # ----------------------------------------------------------
    # WebPage / Online
    # ----------------------------------------------------------
    OnlineBookPageResponse:
      allOf:
        - $ref: "#/components/schemas/NyaApiResponse"
        - type: object
          properties:
            onlineBookPage:
              $ref: "#/components/schemas/OnlineBookPage"
            books:
              type: array
              items:
                $ref: "#/components/schemas/EBook"
              description: DB内に存在するBook一覧
            tags:
              type: array
              items:
                $ref: "#/components/schemas/TagEntity"
              description: 関連タグ一覧
            totalCount:
              type: integer
              description: 総件数
            currentPage:
              type: integer
              description: 現在のページ番号
            totalPage:
              type: integer
              description: 総ページ数
            pageSize:
              type: integer
              description: 1ページあたりの件数

    OnlineBookResponse:
      allOf:
        - $ref: "#/components/schemas/NyaApiResponse"
        - type: object
          properties:
            onlineBook:
              $ref: "#/components/schemas/OnlineBook"
            book:
              $ref: "#/components/schemas/EBook"
            tags:
              type: array
              items:
                $ref: "#/components/schemas/TagEntity"
              description: 関連タグ一覧

    OnlineBook:
      description: オンラインBook情報（EBookを継承、Status固定=WebBook）
      allOf:
        - $ref: "#/components/schemas/EBook"
        - type: object
          properties:
            status:
              $ref: "#/components/schemas/NyaBookStatus"
              description: 常にWebBook

    OnlineBookPage:
      type: object
      description: オンラインBookページ情報（スクレイピング結果）
      properties:
        url:
          type: string
          description: ページURL
        currentPage:
          type: integer
          description: 現在のページ番号
        totalPage:
          type: integer
          description: 総ページ数
        books:
          type: array
          items:
            $ref: "#/components/schemas/OnlineBookInPage"
          description: ページ内のBook一覧

    OnlineBookInPage:
      type: object
      description: オンラインBookページ内の個別Book情報
      properties:
        url:
          type: string
          description: BookのURL
        groupId:
          type: string
          description: グループID
        bookId:
          type: string
          description: BookID
        title:
          type: string
          description: タイトル
        captions:
          type: object
          additionalProperties:
            type: string
          description: キャプション（言語別）
        totalPage:
          type: integer
          description: 総ページ数
        tagSet:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: タグセット（NyaTagType -> タグ名リスト）
        uploadedTime:
          type: string
          format: date-time
          description: アップロード日時
        pageUrls:
          type: array
          items:
            type: string
          description: ページ画像URLリスト
        status:
          $ref: "#/components/schemas/NyaBookStatus"
          description: 常にWebBookInPage

    # ----------------------------------------------------------
    # Tag Additional Name
    # ----------------------------------------------------------
    AdditionalNameStatus:
      type: string
      enum: [Pending, Approved]
      description: タグ表示名の承認ステータス

    AdditionalNameSource:
      type: string
      enum: [None, Dictionary, LocalLLM, Manual]
      description: タグ表示名のソース（生成元）

    TagAdditionalNameDto:
      type: object
      properties:
        name:
          type: string
          description: タグ名
        tagType:
          $ref: "#/components/schemas/NyaTagType"
        primaryAdditionalName:
          type: string
          description: 主表示名（日本語）
        status:
          $ref: "#/components/schemas/AdditionalNameStatus"
        source:
          $ref: "#/components/schemas/AdditionalNameSource"
        candidates:
          type: array
          items:
            type: string
          description: 表示名候補リスト
        count:
          type: integer
          description: タグ使用回数

    TagAdditionalNameListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TagAdditionalNameDto"
          description: タグ表示名一覧
        total:
          type: integer
          format: int64
          description: 総件数
        page:
          type: integer
          description: 現在のページ番号
        limit:
          type: integer
          description: 1ページあたりの件数

    TagAdditionalNameBatchGetRequest:
      type: object
      properties:
        name:
          type: string
          description: タグ名
        tagType:
          $ref: "#/components/schemas/NyaTagType"

    TagAdditionalNameBatchGetResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TagAdditionalNameDto"
          description: 取得結果

    TagAdditionalNameUpsertRequest:
      type: object
      properties:
        name:
          type: string
          description: タグ名
        tagType:
          $ref: "#/components/schemas/NyaTagType"
        primaryAdditionalName:
          type: string
          description: 主表示名（日本語）
        status:
          $ref: "#/components/schemas/AdditionalNameStatus"
        source:
          $ref: "#/components/schemas/AdditionalNameSource"
        candidates:
          type: array
          items:
            type: string
          description: 表示名候補リスト

    TagAdditionalNameUpsertResponse:
      type: object
      properties:
        created:
          type: integer
